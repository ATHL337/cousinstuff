{{ $slot := .Params.slot | default 0 }}
{{ $subtitle := .Params.subtitle | default (.Params.collection | default (.Params.category | default "CousinStuff Family Recipe")) }}

<div class="vt-placard">
  <div class="vt-placard-top">
    {{ if gt $slot 0 }}
      <span class="vt-placard-chip">VT-{{ printf "%02d" $slot }}</span>
    {{ else }}
      <span class="vt-placard-chip">CS</span>
    {{ end }}
    <span class="vt-placard-title">{{ .Title }}</span>
  </div>
  <div class="vt-placard-sub">{{ $subtitle }}</div>
</div>
